# Authoritative subject list for the system.
#
# The initial system scope is exactly seven subjects (SYSTEM_SPEC §6). Chemistry was
# added on 2026-09-12: data/organized/chemistry holds 28 tracked Physical Sciences
# Paper 2 files with no configured subject to belong to. Each
# subject carries its own source corpus, curriculum mapping, taxonomy,
# understanding models, breakdown models, diagnostic knowledge and validation
# report. The architecture is shared; the knowledge is subject-specific.
#
# Execution order for the knowledge-building phases is prescribed by
# IMPLEMENTATION_SPEC §23 and recorded here as `execution_order`.
subjects:
  biology:
    slug: biology
    display_name: "Biology"
    scope: "Grade 11"
  physics:
    slug: physics
    display_name: "Physics"
    scope: "Grade 11"
  chemistry:
    slug: chemistry
    display_name: "Chemistry"
    scope: "Grade 11"
    note: "Physical Sciences Paper 2. Added 2026-09-12; shares the Grade 11 Physical Sciences corpus with physics."
  history:
    slug: history
    display_name: "History"
    scope: "Grade 11"
  english:
    slug: english
    display_name: "English"
    scope: "Grade 11"
  ap_mathematics:
    slug: ap_mathematics
    display_name: "AP Mathematics"
    scope: "Grade 11"
  mathematics:
    slug: mathematics
    display_name: "Mathematics"
    scope: "Grade 11"

execution_order:
  - biology
  - physics
  - chemistry
  - history
  - english
  - ap_mathematics
  - mathematics

primary_source:
  name: "St Benedict's Online Resource Centre (ORC)"
  base_url: "https://sites.google.com/stbenedicts.co.za/orc"
